<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FireRed Lab</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      @layer legacy {
      :root {
        --bg: #14161a;
        --line: #2c313a;
        --text: #e6e8eb;
        --muted: #8b929c;
        --scroll: #3d4450;
      }
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scroll); border: 2px solid transparent; border-radius: 999px; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .legacy { font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--text); }
      .screen {
        position: relative;
        width: 100%;
        aspect-ratio: 3 / 2;
        margin: 0 auto;
        background: #000;
        border: 1px solid var(--line);
      }
      @media (min-width: 900px) {
        .screen { max-width: max(300px, calc((100dvh - 420px) * 1.5)); }
      }
      .screen canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      }
    </style>
  </head>
  <body>
    <nav id="nav" class="ds border-b border-line"></nav>
    <main id="lab" class="ds flex flex-col min-[900px]:min-h-0 min-[900px]:flex-1"></main>
    <div id="grid" class="ds min-[900px]:min-h-0 min-[900px]:flex-1 min-[900px]:overflow-y-auto" hidden></div>
    <div id="parking" hidden>
      <div class="screen" id="screen">
        <canvas id="game" width="240" height="160"></canvas>
        <canvas id="overlay" width="720" height="480"></canvas>
      </div>
    </div>
    <div id="doc" class="min-[900px]:min-h-0 min-[900px]:flex-1" hidden></div>
    <div id="components" hidden></div>
    <div id="toasts" class="ds bg-none"></div>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
